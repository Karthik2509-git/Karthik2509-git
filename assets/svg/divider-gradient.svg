<svg xmlns="http://www.w3.org/2000/svg" width="850" height="12" viewBox="0 0 850 12">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D6EFD" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.15;0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#0D6EFD" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#06B6D4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.15;0" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect x="50" y="5" width="750" height="1.5" rx="1" fill="url(#divGrad)"/>
</svg>
